included:
  - Sources
  - Tests

excluded:
  - .build
  - Package.swift

disabled_rules:
  # swift-format places the brace after a wrapped declaration on the next line;
  # SwiftLint's opening_brace rule requires the opposite layout.
  - opening_brace

trailing_comma:
  mandatory_comma: true

file_length:
  warning: 500
  error: 500

type_body_length:
  warning: 300
  error: 300

function_body_length:
  warning: 60
  error: 60

line_length:
  warning: 120
  error: 120
